[package]
name = "musicbox-organizer"
version = "1.0.0"
edition = "2024"
description = "Simple MP3 playlist organizer with ID3 editing for portable audio devices."
authors = ["ijash"]
repository = "https://github.com/ijash/musicbox-organizer"
license = "GPL-2.0-only"

[dependencies]
# Core audio handling
metaflac = "0.2"
id3 = "1.14"
rodio = "0.19"
ebur128 = "0.1"
mp3lame-encoder = "0.1"
tempfile = "3"

# Utilities
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }

# GUI frameworks (cross-platform, pure Rust eframe/egui with glow renderer)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_extras = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[dev-dependencies]
egui_kittest = { version = "0.31", default-features = false, features = ["eframe"] }

[lib]
name = "musicbox_organizer"
path = "src/lib.rs"

[[bin]]
name = "musicbox"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
