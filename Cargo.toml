[package]
name = "musicbox-organizer"
version = "0.1.0"
edition = "2021"
description = "Simple MP3 playlist organizer with ID3 editing for portable audio devices."
authors = ["ijash"]
repository = "https://github.com/ijash/musicbox-organizer"
license = "TODO"

[dependencies]
# Core audio handling
metaflac = "0.2"

# UI frameworks (platform-specific, selected at build time)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.17"

# Utilities
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "musicbox"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
